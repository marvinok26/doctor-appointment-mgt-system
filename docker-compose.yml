name: hospital-appointment-system

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hospital-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"YourStrong!Passw0rd\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [hospital-net]

  redis:
    image: redis:7-alpine
    container_name: hospital-redis
    # No host port published: the API reaches this over the internal hospital-net bridge by
    # service name ("redis:6379"), and not exposing it to the host avoids colliding with a
    # locally-installed Redis (or anything else) already bound to 6379 on the machine — also just
    # better practice generally (see README's guidance on not exposing DB/cache ports in prod).
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [hospital-net]

  # Dev-only SMTP catcher — appointment reminder emails land here instead of a real inbox.
  # Web UI at http://localhost:5080
  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: hospital-smtp4dev
    ports:
      - "5080:80"
      - "1025:25"
    networks: [hospital-net]

  api:
    build:
      context: .
      dockerfile: backend/src/HospitalSystem.Api/Dockerfile
    container_name: hospital-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=HospitalSystem;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"
      Email__SmtpHost: "smtp4dev"
      Email__SmtpPort: "25"
      Jwt__Secret: "${JWT_SECRET:-REPLACE_WITH_A_LONG_RANDOM_SECRET_AT_LEAST_32_BYTES}"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Seed__AdminEmail: "${ADMIN_EMAIL:-admin@hospitalsystem.local}"
      Seed__AdminPassword: "${ADMIN_PASSWORD:-ChangeMe!2026Secure}"
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [hospital-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:5000"
    container_name: hospital-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks: [hospital-net]

networks:
  hospital-net:
    driver: bridge

volumes:
  sqlserver-data:
  redis-data:
